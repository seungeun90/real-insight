<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 페이지</title>
    <script defer src="admin.js"></script>
    <script defer src="common.js"></script>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <div class="container">
        <h2>관리자 페이지</h2>

        <div class="tabs">
            <div class="tab active" data-tab="city_dis_code"> City 지역 코드 업로드</div>
            <div class="tab" data-tab="apt_dis_code"> APT 지역 코드 업로드</div>
            <div class="tab" data-tab="city_batch">지역 정보 배치</div>
            <div class="tab" data-tab="apt_batch">️아파트 거래 정보 배치</div>
            <div class="tab" data-tab="batch">⚙️ 배치 작업 현황</div>
        </div>

        <!-- 탭 컨텐츠 -->
        <div id="city_dis_code" class="tab-content active">
            <h3>City 지역 코드 업로드</h3>
            <input type="file" id="cityFile" accept=".xlsx, .xls">
            <button onclick="uploadCityDistrictCode()">업로드</button>
            <button onclick="sendCityDistrictCode()">보내기</button>
            <div class="count" id="cityCount">로드된 데이터: 0건</div>
        </div>

        <div id="apt_dis_code" class="tab-content">
            <h3>APT 지역 코드 업로드</h3>
            <input type="file" id="aptFile" accept=".txt">
            <button onclick="uploadAptRegionCode()">업로드</button>
            <div class="count" id="aptCount">로드된 데이터: 0건</div>
        </div>

        <div id="city_batch" class="tab-content">
            <h3>지역 정보 배치</h3>
            <div class="inline-group">
                <label for="province">지역코드 선택</label>
                <select id="province">
                    <option value="">시/도 선택</option>
                </select>
            </div>
            <div class="inline-group">
                <label for="year">연도 선택</label>
                <select id="year">
                    <option value="2021">2021</option>
                    <option value="2022">2022</option>
                    <option value="2023">2023</option>
                </select>
            </div>
            <label>배치 종류 선택</label>
            <div class="checkbox-group">
                <label><input type="checkbox" value="지역정보" /> 지역정보</label>
                <label><input type="checkbox" value="인구비율" /> 인구비율</label>
                <label><input type="checkbox" value="직장정보" /> 직장정보</label>
            </div>
            <button onclick="startRegionBatch()">Save</button>
        </div>

        <div id="apt_batch" class="tab-content">
            <h3>아파트 거래 정보 업로드</h3>
            <select id="region">
                <option value="">시/도 선택</option>
            </select>
            <button onclick="updateAptInfo()">아파트 정보 update</button>
            <br/><br/>
            <input type="month" id="startDate">
            <input type="month" id="endDate">
            <button onclick="startAptBatch()">아파트 거래 정보 update</button>
        </div>

        <div id="batch" class="tab-content">
            <h3>배치 작업 현황</h3>
            <button onclick="loadBatchHistory()">배치 조회</button>
            <table border="1" width="100%" style="margin-top:10px;">
                <thead>
                <tr><th>배치 ID</th><th>타입</th><th>상태</th><th>처리 건수</th><th>실행일</th></tr>
                </thead>
                <tbody id="batchTable"></tbody>
            </table>
        </div>

    </div>
