server:
  port: 8085
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  application:
    name: city-batch
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false  # 자동 실행 방지
  datasource:
    service:
      jdbc-url: jdbc:mysql://ip-172-31-45-181.ap-northeast-2.compute.internal:3306/city?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      username: admin
      password: admin
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 10
        idle-timeout: 300000 # 5분 정도 추천
        connection-timeout: 30000 # 30초 이상으로
        max-lifetime: 1800000 # 30분 유지
    batch:
      jdbc-url: jdbc:mysql://ip-172-31-45-181.ap-northeast-2.compute.internal:3306/city_batch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      username: admin
      password: admin
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 10
        idle-timeout: 300000 # 5분 정도 추천
        connection-timeout: 30000 # 30초 이상으로
        max-lifetime: 1800000 # 30분 유지
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        storage_engine: innodb
        show_sql: true
        format_sql: true
    show-sql: true
  rabbitmq:
    host: 15.164.133.223
    port: 5672
    username : admin
    password: secret

rabbitmq:
  population:
    exchange-name: real-exchange
    queue-name: pop-queue
    routing-key: pop-key
    durable: true
    exclusive: false
    auto-delete: false
  city:
    exchange-name: real-exchange
    queue-name: city-queue
    routing-key: city-key
    durable: true
    exclusive: false
    auto-delete: false
  employment:
    exchange-name: real-exchange
    queue-name: emp-queue
    routing-key: emp-key
    durable: true
    exclusive: false
    auto-delete: false
  district:
    exchange-name: real-exchange
    queue-name: district-queue
    routing-key: district-key
    durable: true
    exclusive: false
    auto-delete: false
  ranking:
    exchange-name: real-exchange
    durable: true
    exclusive: false
    auto-delete: false
    city:
      queue-name: city-rank-queue
      routing-key: city-rank-key
    population:
      queue-name: pop-rank-queue
      routing-key: pop-rank-key
  dead-letter:
    exchange-name: dead-exchange
    queue-name: dead-queue
    routing-key: dead-key
    durable: true
city-api:
  key: ${CITY_CONSUMER_KEY}
  secret: ${CITY_CONSUMER_SECRET}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
logging:
  config: classpath:logback/logback-spring.xml #BOOT-INF/classes/logback/logback-spring.xml