worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name real-insight.kr www.real-insight.kr;
        root /usr/share/nginx/html;

        location = / {
            return 302 /city.html;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
