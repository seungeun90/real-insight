dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    //DB connection
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springframework:spring-jdbc'

    //JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    //QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'


    //Batch
    implementation 'org.springframework.boot:spring-boot-starter-batch'

    //비동기 DB
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    // Spring 공식 MySQL R2DBC 드라이버
    runtimeOnly 'org.mariadb:r2dbc-mariadb:1.2.0' // MariaDB 드라이버가 MySQL과 호환됨

    //객체 매핑
    implementation 'org.mapstruct:mapstruct:1.5.3.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.3.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    //Xml mapper
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.18.3'

}

def querydslSrcDir = 'build/generated/sources/annotationProcessor/java/main'

sourceSets {
    main {
        java.srcDir("$buildDir/generated/sources/annotationProcessor/java/main")
    }
}

compileJava {
    options.compilerArgs << '-Aquerydsl.generatedAnnotationClass=javax.annotation.Generated'
}

tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory = file(querydslSrcDir)
}

clean {
    delete file(querydslSrcDir)
}

bootJar{
    enabled(true)
}
jar{
    enabled(false)
}